<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prismara ist ein browserbasiertes Lichtpuzzle mit Spiel und interaktivem Gehirn Lab.">
  <meta name="prismara-build" content="{{ site.github.build_revision }}">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Prismara</title>
  <style>
    html.prismara-locked, html.prismara-locked body { overflow: hidden; }
    html.prismara-locked body > :not(#prismara-entry):not(#prismara-access):not(#prismara-mystic-animation) { visibility: hidden !important; pointer-events: none !important; }
    #prismara-entry { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px; color: #f4f1ff; background: radial-gradient(ellipse at center, #171326 0, #090a12 54%, #030308 100%); font: 600 clamp(1.2rem, 4vw, 2rem)/1.4 system-ui, sans-serif; text-align: center; }
    #prismara-entry[hidden] { display: none; }
    #prismara-entry p { margin: 0; text-shadow: 0 0 30px rgba(168,140,255,.2); }
    #prismara-enter { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 34px; height: 34px; padding: 0; border: 1px solid rgba(220,215,255,.12); border-radius: 50%; color: rgba(231,224,255,.36); background: rgba(255,255,255,.025); font: 18px/1 system-ui,sans-serif; opacity: .18; cursor: pointer; transition: opacity .25s, border-color .25s, box-shadow .25s; }
    #prismara-enter:hover, #prismara-enter:focus-visible { opacity: 1; border-color: rgba(68,222,255,.72); outline: 2px solid rgba(68,222,255,.5); outline-offset: 3px; box-shadow: 0 0 24px rgba(68,222,255,.32); }
    #prismara-access { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px; color: #f3f4f6; background: rgba(8,11,18,.28); backdrop-filter: blur(22px) saturate(1.5); font: 16px/1.5 system-ui, sans-serif; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility .45s ease; }
    #prismara-access.is-visible { opacity: 1; visibility: visible; }
    #prismara-access[hidden] { display: none; }
    #prismara-access .gate-card { width: min(100%, 390px); padding: 28px; border: 1px solid rgba(168,140,255,.46); border-radius: 18px; background: linear-gradient(145deg, #171326, #111722 68%, #0b1c24); box-shadow: 0 24px 80px #0009, 0 0 34px rgba(125,94,255,.14); }
    #prismara-access h1 { margin: 0 0 8px; font-size: 1.5rem; }
    #prismara-access p { margin: 0 0 20px; color: #c5c0d9; }
    #prismara-access label { display: block; margin: 12px 0 6px; }
    #prismara-access input[type="password"] { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #6f67a0; border-radius: 9px; color: #fff; background: #080b12; font: inherit; }
    #prismara-access .remember { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; color: #c4ccda; font-size: .9rem; }
    #prismara-access button { width: 100%; padding: 12px; border: 1px solid #a88cff; border-radius: 9px; color: #fff; background: linear-gradient(115deg, #9c52ec, #487ded 55%, #35c7c6); font: inherit; font-weight: 650; cursor: pointer; }
    #prismara-access .error { min-height: 1.5em; margin: 10px 0 0; color: #ff9bad; font-size: .9rem; }
    #prismara-access .hosted-by { margin: -12px 0 20px; color: #a9a0c8; font-size: .78rem; letter-spacing: .04em; }
    #prismara-mystic-animation { position: fixed; inset: 0; z-index: 2147483646; width: 100%; height: 100%; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, #0c0a1d 0, #05060d 68%, #020307); transition: opacity .7s ease; }
    #prismara-mystic-animation.is-playing { opacity: 1; }
    @media (max-width: 500px) { #prismara-access { padding: 14px; } #prismara-access .gate-card { padding: 22px; } }
    @media (prefers-reduced-motion: reduce) { #prismara-mystic-animation { display: none; } }
  </style>
  <script>
    (() => {
      const KEY = 'prismara.access.until';
      const PIN_HASH = '5cdd2ecd9144c60e5ec740347b5f10be763395ee8b9f22e5a6a8f0a340066187';
      document.documentElement.classList.add('prismara-locked');
      document.addEventListener('DOMContentLoaded', () => {
        const entry = document.getElementById('prismara-entry');
        const enterButton = document.getElementById('prismara-enter');
        const gate = document.getElementById('prismara-access');
        const form = document.getElementById('prismara-access-form');
        const input = document.getElementById('prismara-pin');
        const error = document.getElementById('prismara-pin-error');
        const canvas = document.getElementById('prismara-mystic-animation');
        const ctx = canvas.getContext('2d');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const stars = Array.from({ length: 280 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .25, phase: Math.random() * 6.28, hue: Math.random() * 300 + 170 }));
        let frame = 0;
        const resize = () => {
          const ratio = Math.min(devicePixelRatio || 1, 1.5);
          canvas.width = Math.round(innerWidth * ratio);
          canvas.height = Math.round(innerHeight * ratio);
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        };
        const playMysticAnimation = (onComplete) => {
          if (reducedMotion) { onComplete(); return; }
          cancelAnimationFrame(frame);
          resize();
          canvas.classList.add('is-playing');
          const started = performance.now();
          const draw = (now) => {
            const progress = Math.min(1, (now - started) / 5400);
            const fade = Math.min(1, progress * 4, (1 - progress) * 4);
            const w = innerWidth, h = innerHeight, cx = w / 2, cy = h * .48;
            const scale = Math.min(1.25, Math.max(.62, w / 820)), bloom = Math.sin(progress * Math.PI);
            ctx.clearRect(0, 0, w, h);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (const star of stars) {
              const twinkle = .25 + .75 * Math.abs(Math.sin(now * .001 + star.phase));
              const depth = .18 + progress * .9;
              const sx = cx + (star.x * w - cx) * depth, sy = cy + (star.y * h - cy) * depth;
              ctx.fillStyle = `hsla(${star.hue},100%,78%,${twinkle * fade * .78})`;
              ctx.beginPath(); ctx.arc(sx, sy, star.r * scale * (1 + twinkle), 0, 6.28); ctx.fill();
            }
            const radius = (80 + bloom * Math.min(w, h) * .34) * scale;
            const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.8);
            aura.addColorStop(0, `rgba(255,255,255,${.2 * fade})`); aura.addColorStop(.16, `rgba(126,106,255,${.24 * fade})`); aura.addColorStop(.48, `rgba(68,222,255,${.12 * fade})`); aura.addColorStop(1, 'rgba(68,222,255,0)');
            ctx.fillStyle = aura; ctx.fillRect(cx - radius * 2, cy - radius * 2, radius * 4, radius * 4);
            for (let ring = 0; ring < 7; ring++) {
              const ringProgress = (progress * 1.15 + ring / 7) % 1;
              const rx = (32 + ringProgress * Math.min(w, h) * .58) * scale;
              ctx.beginPath(); ctx.ellipse(cx, cy, rx, rx * (.42 + ring * .018), now * .00018 * (ring % 2 ? -1 : 1) + ring * .7, 0, 6.28);
              ctx.strokeStyle = `hsla(${180 + ring * 37 + now * .012},100%,${72 + ring % 2 * 10}%,${(.48 - ring * .035) * fade * (1 - ringProgress * .5)})`; ctx.lineWidth = (ring % 3 ? 1 : 2.2) * scale; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 24 * scale; ctx.stroke();
            }
            for (let i = 0; i < 112; i++) {
              const angle = i * Math.PI / 56 + now * .00012 * (i % 2 ? 1 : -1), inner = (18 + (i % 9) * 4) * scale, outer = (70 + bloom * Math.min(w, h) * .48 + (i % 7) * 22) * scale;
              ctx.beginPath(); ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner); ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
              ctx.strokeStyle = `hsla(${(i * 13 + now * .025) % 360},100%,${70 + i % 3 * 8}%,${(.07 + bloom * .34) * fade})`; ctx.lineWidth = (i % 8 ? .7 : 2.4) * scale; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18 * scale; ctx.stroke();
            }
            for (let i = 0; i < 180; i++) {
              const t = (progress * 1.4 + i / 180) % 1, a = i * 2.399 + now * .0005, r = (25 + t * Math.min(w, h) * .45) * scale;
              const px = cx + Math.cos(a + t * 8) * r, py = cy + Math.sin(a + t * 8) * r * .58;
              ctx.beginPath(); ctx.arc(px, py, (1 + (i % 4) * .55) * scale, 0, 6.28);
              ctx.fillStyle = `hsla(${(190 + i * 7 + now * .035) % 360},100%,${70 + i % 4 * 6}%,${(.16 + .58 * (1 - t)) * fade})`; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12 * scale; ctx.fill();
            }
            ctx.translate(cx, cy); ctx.rotate(now * .00033);
            for (let shard = 0; shard < 3; shard++) {
              const size = (26 + bloom * 46 - shard * 6) * scale, rot = shard * 2.094;
              ctx.save(); ctx.rotate(rot); ctx.beginPath(); ctx.moveTo(0, -size * 1.35); ctx.lineTo(size * .82, size * .72); ctx.lineTo(0, size * .3); ctx.lineTo(-size * .82, size * .72); ctx.closePath();
              const glass = ctx.createLinearGradient(-size, -size, size, size); glass.addColorStop(0, `rgba(255,255,255,${.96 * fade})`); glass.addColorStop(.42, `hsla(${185 + shard * 47 + now * .02},100%,72%,${.78 * fade})`); glass.addColorStop(1, `hsla(${285 + shard * 24 + now * .03},100%,68%,${.82 * fade})`);
              ctx.fillStyle = glass; ctx.shadowColor = shard % 2 ? '#44deff' : '#bd72ff'; ctx.shadowBlur = 38 * scale; ctx.fill(); ctx.strokeStyle = `rgba(255,255,255,${.88 * fade})`; ctx.lineWidth = 1.5 * scale; ctx.stroke(); ctx.restore();
            }
            ctx.restore();
            if (progress < 1) frame = requestAnimationFrame(draw);
            else { canvas.classList.remove('is-playing'); window.setTimeout(onComplete, 520); }
          };
          frame = requestAnimationFrame(draw);
        };
        const unlock = () => { document.documentElement.classList.remove('prismara-locked'); gate.hidden = true; gate.classList.remove('is-visible'); };
        let remembered = false;
        try { remembered = Number(localStorage.getItem(KEY)) > Date.now(); if (!remembered) localStorage.removeItem(KEY); } catch { /* PIN bei jedem Besuch abfragen. */ }
        gate.inert = true;
        gate.setAttribute('aria-hidden', 'true');
        const begin = () => {
          entry.hidden = true;
          playMysticAnimation(() => {
            if (remembered) { unlock(); return; }
            gate.inert = false;
            gate.removeAttribute('aria-hidden');
            gate.classList.add('is-visible');
            input.focus();
          });
        };
        enterButton.addEventListener('click', begin);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const bytes = new TextEncoder().encode(input.value.trim());
          const digest = await crypto.subtle.digest('SHA-256', bytes);
          const hash = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
          if (hash !== PIN_HASH) { error.textContent = 'Die PIN stimmt nicht. Bitte versuche es erneut.'; input.select(); return; }
          if (document.getElementById('prismara-remember').checked) {
            try { localStorage.setItem(KEY, String(Date.now() + 7 * 24 * 60 * 60 * 1000)); } catch { /* Sitzung bleibt offen. */ }
          }
          unlock();
        });
      });
    })();
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css?v={{ site.github.build_revision }}">
  <script>
    (() => {
      const currentBuild = document.querySelector('meta[name="prismara-build"]')?.content;
      if (!currentBuild) return;
      let reloading = false;
      async function checkForUpdate() {
        if (reloading) return;
        try {
          const url = new URL(location.href);
          url.hash = '';
          url.searchParams.set('prismara-check', Date.now());
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) return;
          const html = await response.text();
          const latestBuild = html.match(/<meta name="prismara-build" content="([^"]+)"/i)?.[1];
          if (latestBuild && latestBuild !== currentBuild) {
            reloading = true;
            const nextUrl = new URL(location.href);
            nextUrl.searchParams.set('prismara-build', latestBuild);
            location.replace(nextUrl);
          }
        } catch { /* Netzwerk nicht erreichbar; beim nächsten Intervall erneut prüfen. */ }
      }
      window.setInterval(checkForUpdate, 60_000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkForUpdate();
      });
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "/src/main.js": "/src/main.js?v={{ site.github.build_revision }}",
        "/src/config.js": "/src/config.js?v={{ site.github.build_revision }}",

        "/src/devlog.js": "/src/devlog.js?v={{ site.github.build_revision }}",

        "/src/lab/projectGraph.js": "/src/lab/projectGraph.js?v={{ site.github.build_revision }}",
        "/src/game/pushLevels.js": "/src/game/pushLevels.js?v={{ site.github.build_revision }}",
        "/src/game/push.js": "/src/game/push.js?v={{ site.github.build_revision }}",
        "/src/game/engine.js": "/src/game/engine.js?v={{ site.github.build_revision }}",
        "/src/game/render.js": "/src/game/render.js?v={{ site.github.build_revision }}",
        "/src/game/progress.js": "/src/game/progress.js?v={{ site.github.build_revision }}"
      }
    }
  </script>
  <script type="module" src="src/main.js?v={{ site.github.build_revision }}"></script>
</head>
<body>
  <section id="prismara-entry" aria-label="Startseite">
    <p>Diese Domain wurde schon genommen.</p>
    <button id="prismara-enter" type="button" aria-label="Prismara öffnen" title="Prismara öffnen">✧</button>
  </section>
  <section id="prismara-access" role="dialog" aria-modal="true" aria-labelledby="prismara-access-title">
    <div class="gate-card">
      <h1 id="prismara-access-title">Geschützte Website</h1>
      <p class="hosted-by">Hosted by Grisgraber Florian</p>
      <p>Bitte gib die PIN ein, um die Website zu öffnen.</p>
      <form id="prismara-access-form">
        <label for="prismara-pin">PIN</label>
        <input id="prismara-pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <label class="remember"><input id="prismara-remember" type="checkbox"> Auf diesem Gerät 7 Tage merken</label>
        <button type="submit">Website öffnen</button>
        <div id="prismara-pin-error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </section>
<canvas id="prismara-mystic-animation" aria-hidden="true"></canvas>
  <div class="bg-fx" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grid"></span></div>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Prismara Startseite">
      <span class="brand-mark" aria-hidden="true"></span>Prismara
    </a>
    <nav class="tabs" aria-label="Hauptbereiche">
      <a href="#/home" data-tab="home">Start</a>
      <a href="#/menu" data-tab="game">Spiel</a>
      <a href="#/lab" data-tab="lab">Gehirn Lab</a>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <noscript>Prismara benötigt JavaScript.</noscript>
</body>
</html>
