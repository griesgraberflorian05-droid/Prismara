<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prismara ist ein browserbasiertes Lichtpuzzle mit Spiel und interaktivem Gehirn Lab.">
  <meta name="prismara-build" content="{{ site.github.build_revision }}">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Prismara</title>
  <style>
    html.prismara-locked, html.prismara-locked body { overflow: hidden; }
    html.prismara-locked body > :not(#prismara-access) { visibility: hidden !important; pointer-events: none !important; }
    #prismara-access { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px; color: #f3f4f6; background: #080b12; font: 16px/1.5 system-ui, sans-serif; }
    #prismara-access[hidden] { display: none; }
    #prismara-access .gate-card { width: min(100%, 390px); padding: 28px; border: 1px solid rgba(168,140,255,.46); border-radius: 18px; background: linear-gradient(145deg, #171326, #111722 68%, #0b1c24); box-shadow: 0 24px 80px #0009, 0 0 34px rgba(125,94,255,.14); }
    #prismara-access h1 { margin: 0 0 8px; font-size: 1.5rem; }
    #prismara-access p { margin: 0 0 20px; color: #c5c0d9; }
    #prismara-access label { display: block; margin: 12px 0 6px; }
    #prismara-access input[type="password"] { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #6f67a0; border-radius: 9px; color: #fff; background: #080b12; font: inherit; }
    #prismara-access .remember { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; color: #c4ccda; font-size: .9rem; }
    #prismara-access button { width: 100%; padding: 12px; border: 1px solid #a88cff; border-radius: 9px; color: #fff; background: linear-gradient(115deg, #9c52ec, #487ded 55%, #35c7c6); font: inherit; font-weight: 650; cursor: pointer; }
    #prismara-access .error { min-height: 1.5em; margin: 10px 0 0; color: #ff9bad; font-size: .9rem; }
    #prismara-access .hosted-by { margin: -12px 0 20px; color: #a9a0c8; font-size: .78rem; letter-spacing: .04em; }
    #prismara-mystic-animation { position: fixed; inset: 0; z-index: 8; width: 100%; height: 100%; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
    #prismara-mystic-animation.is-playing { opacity: 1; transition: opacity .35s ease; }
    @media (max-width: 500px) { #prismara-access { padding: 14px; } #prismara-access .gate-card { padding: 22px; } }
    @media (prefers-reduced-motion: reduce) { #prismara-mystic-animation { display: none; } }
  </style>
  <script>
    (() => {
      const KEY = 'prismara.access.until';
      const PIN_HASH = '5cdd2ecd9144c60e5ec740347b5f10be763395ee8b9f22e5a6a8f0a340066187';
      document.documentElement.classList.add('prismara-locked');
      document.addEventListener('DOMContentLoaded', () => {
        const gate = document.getElementById('prismara-access');
        const form = document.getElementById('prismara-access-form');
        const input = document.getElementById('prismara-pin');
        const error = document.getElementById('prismara-pin-error');
        const canvas = document.getElementById('prismara-mystic-animation');
        const ctx = canvas.getContext('2d');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const stars = Array.from({ length: 280 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .25, phase: Math.random() * 6.28, hue: Math.random() * 300 + 170 }));
        let frame = 0;
        const resize = () => {
          const ratio = Math.min(devicePixelRatio || 1, 1.5);
          canvas.width = Math.round(innerWidth * ratio);
          canvas.height = Math.round(innerHeight * ratio);
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        };
        const playMysticAnimation = () => {
          if (reducedMotion) return;
          cancelAnimationFrame(frame);
          resize();
          canvas.classList.add('is-playing');
          const started = performance.now();
          const draw = (now) => {
            const progress = Math.min(1, (now - started) / 5200);
            const fade = Math.min(1, progress * 5, (1 - progress) * 5);
            const w = innerWidth, h = innerHeight, cx = w / 2, cy = h * .46;
            const scale = Math.min(1, w / 820), bloom = Math.sin(progress * Math.PI);
            ctx.clearRect(0, 0, w, h);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (const star of stars) {
              const twinkle = .25 + .75 * Math.abs(Math.sin(now * .001 + star.phase));
              ctx.fillStyle = `hsla(${star.hue},100%,78%,${twinkle * fade * .7})`;
              ctx.beginPath(); ctx.arc(star.x * w, star.y * h, star.r * scale * (1 + twinkle), 0, 6.28); ctx.fill();
            }
            const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, 270 * scale);
            aura.addColorStop(0, `rgba(126,106,255,${.2 * fade})`); aura.addColorStop(.45, `rgba(68,222,255,${.09 * fade})`); aura.addColorStop(1, 'rgba(68,222,255,0)');
            ctx.fillStyle = aura; ctx.fillRect(cx - 280 * scale, cy - 280 * scale, 560 * scale, 560 * scale);
            for (let ring = 0; ring < 4; ring++) {
              ctx.beginPath(); ctx.ellipse(cx, cy, (74 + ring * 27 + Math.sin(now * .001 + ring) * 7) * scale, (38 + ring * 14) * scale, now * .00018 * (ring % 2 ? -1 : 1) + ring * .7, 0, 6.28);
              ctx.strokeStyle = `hsla(${180 + ring * 53 + now * .012},100%,78%,${(.42 - ring * .06) * fade})`; ctx.lineWidth = ring ? 1 : 2; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 16 * scale; ctx.stroke();
            }
            for (let i = 0; i < 40; i++) {
              const angle = i * Math.PI / 20 + now * .00012, inner = 42 * scale, outer = (100 + bloom * 300 + (i % 4) * 24) * scale;
              ctx.beginPath(); ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner); ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
              ctx.strokeStyle = `hsla(${(i * 19 + now * .025) % 360},100%,72%,${(.05 + bloom * .3) * fade})`; ctx.lineWidth = (i % 6 ? .7 : 2) * scale; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 14 * scale; ctx.stroke();
            }
            const size = (42 + bloom * 28) * scale;
            ctx.translate(cx, cy); ctx.rotate(now * .00045); ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size * .72, size * .58); ctx.lineTo(-size * .72, size * .58); ctx.closePath();
            const glass = ctx.createLinearGradient(-size, -size, size, size); glass.addColorStop(0, `rgba(255,255,255,${.92 * fade})`); glass.addColorStop(.45, `hsla(${190 + now * .02},100%,72%,${.72 * fade})`); glass.addColorStop(1, `hsla(${285 + now * .03},100%,68%,${.78 * fade})`);
            ctx.fillStyle = glass; ctx.shadowColor = '#a88cff'; ctx.shadowBlur = 34 * scale; ctx.fill(); ctx.strokeStyle = `rgba(255,255,255,${.9 * fade})`; ctx.lineWidth = 1.4 * scale; ctx.stroke(); ctx.restore();
            if (progress < 1) frame = requestAnimationFrame(draw); else canvas.classList.remove('is-playing');
          };
          frame = requestAnimationFrame(draw);
        };
        const unlock = () => { document.documentElement.classList.remove('prismara-locked'); gate.hidden = true; playMysticAnimation(); };
        try { if (Number(localStorage.getItem(KEY)) > Date.now()) { unlock(); return; } localStorage.removeItem(KEY); } catch { /* PIN bei jedem Besuch abfragen. */ }
        input.focus();
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const bytes = new TextEncoder().encode(input.value.trim());
          const digest = await crypto.subtle.digest('SHA-256', bytes);
          const hash = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
          if (hash !== PIN_HASH) { error.textContent = 'Die PIN stimmt nicht. Bitte versuche es erneut.'; input.select(); return; }
          if (document.getElementById('prismara-remember').checked) {
            try { localStorage.setItem(KEY, String(Date.now() + 7 * 24 * 60 * 60 * 1000)); } catch { /* Sitzung bleibt offen. */ }
          }
          unlock();
        });
      });
    })();
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css?v={{ site.github.build_revision }}">
  <script>
    (() => {
      const currentBuild = document.querySelector('meta[name="prismara-build"]')?.content;
      if (!currentBuild) return;
      let reloading = false;
      async function checkForUpdate() {
        if (reloading) return;
        try {
          const url = new URL(location.href);
          url.hash = '';
          url.searchParams.set('prismara-check', Date.now());
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) return;
          const html = await response.text();
          const latestBuild = html.match(/<meta name="prismara-build" content="([^"]+)"/i)?.[1];
          if (latestBuild && latestBuild !== currentBuild) {
            reloading = true;
            const nextUrl = new URL(location.href);
            nextUrl.searchParams.set('prismara-build', latestBuild);
            location.replace(nextUrl);
          }
        } catch { /* Netzwerk nicht erreichbar; beim nächsten Intervall erneut prüfen. */ }
      }
      window.setInterval(checkForUpdate, 60_000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkForUpdate();
      });
    })();
  </script>

        "/src/game/push.js": "/src/game/push.js?v={{ site.github.build_revision }}",

        "/src/game/render.js": "/src/game/render.js?v={{ site.github.build_revision }}",
        "/src/game/progress.js": "/src/game/progress.js?v={{ site.github.build_revision }}"
      }
    }
  </script>
  <script type="module" src="src/main.js?v={{ site.github.build_revision }}"></script>
</head>
<body>
  <section id="prismara-access" role="dialog" aria-modal="true" aria-labelledby="prismara-access-title">
    <div class="gate-card">
      <h1 id="prismara-access-title">Geschützte Website</h1>
      <p class="hosted-by">Hosted by Grisgraber Florian</p>
      <p>Bitte gib die PIN ein, um die Website zu öffnen.</p>
      <form id="prismara-access-form">
        <label for="prismara-pin">PIN</label>
        <input id="prismara-pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <label class="remember"><input id="prismara-remember" type="checkbox"> Auf diesem Gerät 7 Tage merken</label>
        <button type="submit">Website öffnen</button>
        <div id="prismara-pin-error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </section>
<canvas id="prismara-mystic-animation" aria-hidden="true"></canvas>
  <div class="bg-fx" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grid"></span></div>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Prismara Startseite">
      <span class="brand-mark" aria-hidden="true"></span>Prismara
    </a>
    <nav class="tabs" aria-label="Hauptbereiche">
      <a href="#/home" data-tab="home">Start</a>
      <a href="#/menu" data-tab="game">Spiel</a>
      <a href="#/lab" data-tab="lab">Gehirn Lab</a>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <noscript>Prismara benötigt JavaScript.</noscript>
