<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prismara ist ein browserbasiertes Lichtpuzzle mit Spiel und interaktivem Gehirn Lab.">
  <meta name="prismara-build" content="{{ site.github.build_revision }}">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Prismara</title>
  <style>
    html.prismara-locked, html.prismara-locked body { overflow: hidden; }
    html.prismara-locked body > :not(#prismara-access) { visibility: hidden !important; pointer-events: none !important; }
    #prismara-access { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px; color: #f3f4f6; background: #080b12; font: 16px/1.5 system-ui, sans-serif; }
    #prismara-access[hidden] { display: none; }
    #prismara-access .gate-card { width: min(100%, 390px); padding: 28px; border: 1px solid #303849; border-radius: 18px; background: #111722; box-shadow: 0 24px 80px #0009; }
    #prismara-access h1 { margin: 0 0 8px; font-size: 1.5rem; }
    #prismara-access p { margin: 0 0 20px; color: #aab4c4; }
    #prismara-access label { display: block; margin: 12px 0 6px; }
    #prismara-access input[type="password"] { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #59657a; border-radius: 9px; color: #fff; background: #080b12; font: inherit; }
    #prismara-access .remember { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; color: #c4ccda; font-size: .9rem; }
    #prismara-access button { width: 100%; padding: 12px; border: 0; border-radius: 9px; color: #111; background: #d0d0d0; font: inherit; font-weight: 650; cursor: pointer; }
    #prismara-access button:hover { background: #fff; }
    #prismara-access .error { min-height: 1.5em; margin: 10px 0 0; color: #ccc; font-size: .9rem; }
    #prismara-access .hosted-by { margin: -12px 0 20px; color: #8792a3; font-size: .78rem; letter-spacing: .04em; }
  </style>
  <script>
    (() => {
      const KEY = 'prismara.access.until';
      const PIN_HASH = '5cdd2ecd9144c60e5ec740347b5f10be763395ee8b9f22e5a6a8f0a340066187';
      document.documentElement.classList.add('prismara-locked');
      document.addEventListener('DOMContentLoaded', () => {
        const gate = document.getElementById('prismara-access');
        const form = document.getElementById('prismara-access-form');
        const input = document.getElementById('prismara-pin');
        const error = document.getElementById('prismara-pin-error');
        const unlock = () => {
          document.documentElement.classList.remove('prismara-locked');
          gate.hidden = true;
        };
        try {
          if (Number(localStorage.getItem(KEY)) > Date.now()) { unlock(); return; }
          localStorage.removeItem(KEY);
        } catch { /* Speicher nicht verfügbar: PIN bei jedem Besuch abfragen. */ }
        input.focus();
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const bytes = new TextEncoder().encode(input.value.trim());
          const digest = await crypto.subtle.digest('SHA-256', bytes);
          const enteredHash = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
          if (enteredHash !== PIN_HASH) {
            error.textContent = 'Die PIN stimmt nicht. Bitte versuche es erneut.';
            input.select();
            return;
          }
          if (document.getElementById('prismara-remember').checked) {
            try { localStorage.setItem(KEY, String(Date.now() + 7 * 24 * 60 * 60 * 1000)); } catch { /* Sitzung bleibt offen. */ }
          }
          unlock();
        });
      });
    })();
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css?v={{ site.github.build_revision }}">
  <script>
    (() => {
      const currentBuild = document.querySelector('meta[name="prismara-build"]')?.content;
      if (!currentBuild) return;
      let reloading = false;
      async function checkForUpdate() {
        if (reloading) return;
        try {
          const url = new URL(location.href);
          url.hash = '';
          url.searchParams.set('prismara-check', Date.now());
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) return;
          const html = await response.text();
          const latestBuild = html.match(/<meta name="prismara-build" content="([^"]+)"/i)?.[1];
          if (latestBuild && latestBuild !== currentBuild) {
            reloading = true;
            const nextUrl = new URL(location.href);
            nextUrl.searchParams.set('prismara-build', latestBuild);
            location.replace(nextUrl);
          }
        } catch { /* Netzwerk nicht erreichbar; beim nächsten Intervall erneut prüfen. */ }
      }
      window.setInterval(checkForUpdate, 60_000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkForUpdate();
      });
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "/src/main.js": "/src/main.js?v={{ site.github.build_revision }}",
        "/src/config.js": "/src/config.js?v={{ site.github.build_revision }}",
        "/src/settings.js": "/src/settings.js?v={{ site.github.build_revision }}",
        "/src/devlog.js": "/src/devlog.js?v={{ site.github.build_revision }}",
        "/src/ui/menu.js": "/src/ui/menu.js?v={{ site.github.build_revision }}",
        "/src/ui/homeView.js": "/src/ui/homeView.js?v={{ site.github.build_revision }}",
        "/src/ui/pushView.js": "/src/ui/pushView.js?v={{ site.github.build_revision }}",
        "/src/ui/celebrate.js": "/src/ui/celebrate.js?v={{ site.github.build_revision }}",
        "/src/lab/labView.js": "/src/lab/labView.js?v={{ site.github.build_revision }}",
        "/src/lab/brainMap.js": "/src/lab/brainMap.js?v={{ site.github.build_revision }}",
        "/src/lab/projectGraph.js": "/src/lab/projectGraph.js?v={{ site.github.build_revision }}",
        "/src/game/pushLevels.js": "/src/game/pushLevels.js?v={{ site.github.build_revision }}",
        "/src/game/push.js": "/src/game/push.js?v={{ site.github.build_revision }}",
        "/src/game/engine.js": "/src/game/engine.js?v={{ site.github.build_revision }}",
        "/src/game/render.js": "/src/game/render.js?v={{ site.github.build_revision }}",
        "/src/game/progress.js": "/src/game/progress.js?v={{ site.github.build_revision }}"
      }
    }
  </script>
  <script type="module" src="src/main.js?v={{ site.github.build_revision }}"></script>
</head>
<body>
  <section id="prismara-access" role="dialog" aria-modal="true" aria-labelledby="prismara-access-title">
    <div class="gate-card">
      <h1 id="prismara-access-title">Geschützte Website</h1>
      <p class="hosted-by">Hosted by Grisgraber Florian</p>
      <p>Bitte gib die PIN ein, um die Website zu öffnen.</p>
      <form id="prismara-access-form">
        <label for="prismara-pin">PIN</label>
        <input id="prismara-pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <label class="remember"><input id="prismara-remember" type="checkbox"> Auf diesem Gerät 7 Tage merken</label>
        <button type="submit">Website öffnen</button>
        <div id="prismara-pin-error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </section>
  <div class="bg-fx" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grid"></span></div>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Prismara Startseite">
      <span class="brand-mark" aria-hidden="true"></span>Prismara
    </a>
    <nav class="tabs" aria-label="Hauptbereiche">
      <a href="#/home" data-tab="home">Start</a>
      <a href="#/menu" data-tab="game">Spiel</a>
      <a href="#/lab" data-tab="lab">Gehirn Lab</a>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <noscript>Prismara benötigt JavaScript.</noscript>
</body>
</html>
