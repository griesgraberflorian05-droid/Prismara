<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Prismara — Licht in neuer Ordnung</title>
  <desc id="desc">A glass prism splits a bright beam into spectral rays against a deep midnight background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset=".55" stop-color="#111631"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#8cecff" stop-opacity=".72"/><stop offset="1" stop-color="#ad8cff" stop-opacity=".85"/></linearGradient>
    <linearGradient id="word" x1="0" x2="1"><stop stop-color="#73e6ff"/><stop offset=".55" stop-color="#c5b4ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#5748c8" stop-opacity=".46"/><stop offset="1" stop-color="#111631" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <ellipse cx="800" cy="181" rx="360" ry="220" fill="url(#halo)"/>
  <g opacity=".22" stroke="#aab6ff"><path d="M50 55H1150M50 110H1150M50 165H1150M50 220H1150M50 275H1150M50 330H1150"/><path d="M100 25V335M200 25V335M300 25V335M400 25V335M500 25V335M600 25V335M700 25V335M800 25V335M900 25V335M1000 25V335M1100 25V335"/></g>
  <path d="M76 181h478" stroke="#f3feff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="548" cy="181" r="6" fill="#fff" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <path d="m552 75 130 212H422Z" fill="#a8efff" fill-opacity=".09" stroke="url(#glass)" stroke-width="5" stroke-linejoin="round"/>
    <path d="m552 91-99 180h198Z" fill="url(#glass)" fill-opacity=".09"/>
    <path d="M672 151 1120 67" stroke="#ff526e" stroke-width="5" stroke-linecap="round"/>
    <path d="M682 166 1125 140" stroke="#ffb454" stroke-width="5" stroke-linecap="round"/>
    <path d="M686 181h445" stroke="#f6f875" stroke-width="5" stroke-linecap="round"/>
    <path d="M682 196 1125 222" stroke="#55efa7" stroke-width="5" stroke-linecap="round"/>
    <path d="M672 211 1120 295" stroke="#5aaeff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="82" y="120" fill="url(#word)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="760" letter-spacing="-2">Prismara</text>
  <text x="86" y="235" fill="#d9e1f4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="5">LICHT IN NEUER ORDNUNG</text>
  <text x="86" y="279" fill="#929db8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Ein Lichtpuzzle · ein interaktives Gehirn Lab · von Florian</text>
</svg>

