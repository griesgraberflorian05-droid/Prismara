<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Prismara</title>
  <desc id="desc">A luminous prism sends red, green, blue and violet light across a dark field.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8ffff"/><stop offset=".45" stop-color="#a8f4ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#72e6ff"/><stop offset=".52" stop-color="#c4b5fd"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(18 16)" filter="url(#glow)">
    <path d="M75 8 137 126H13Z" fill="#111827" stroke="url(#glass)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M75 17 31 112h88Z" fill="#a8f4ff" fill-opacity=".12"/>
    <path d="M3 68h47" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="m111 56 70-26" stroke="#ff536b" stroke-width="5" stroke-linecap="round"/>
    <path d="m116 69 76 0" stroke="#53f3a5" stroke-width="5" stroke-linecap="round"/>
    <path d="m111 82 70 27" stroke="#5db7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="m111 69 70 0" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="228" y="111" fill="url(#word)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3">Prismara</text>
  <text x="235" y="145" fill="#aab4c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="5">LIGHT · PLAY · DISCOVER</text>
</svg>

